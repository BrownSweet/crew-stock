[project]
name = "crew-stock"
version = "0.5.0"
description = "Evidence-first Longbridge research agent powered by CrewAI and DeepSeek"
requires-python = ">=3.12,<3.13"
dependencies = [
  "crewai==1.15.22",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pyyaml>=6,<7",
  "python-multipart>=0.0.20,<1",
  "pypdfium2>=4.30,<6",
  "pillow>=11,<13",
  "openpyxl>=3.1,<4",
  "pymysql[rsa]>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crew_stock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
